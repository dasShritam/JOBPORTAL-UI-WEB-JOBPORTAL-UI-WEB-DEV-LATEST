replicaCount: 1
image:
  repository: $(UI_IMG_REGISTRY)
  pullPolicy: IfNotPresent
  tag: $(Build.BuildId)
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  annotations: {}
  name: ""
podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  name: ui-srv
  type: LoadBalancer
  port: 80
  protocol: TCP


ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []


resources:
  requests:
    cpu: 100m
    memory: 250Mi
  limits:
    cpu: 100m
    memory: 500Mi
app:
  name: ui-depl
  group: ui
  namespace: jobportal-app
  releasename: ui
  releasenamespace: jobportal-app
  managedby: Helm
nodeSelector:
  agentpool: app
